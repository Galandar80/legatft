<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lega TFT Emblem</title>
  <desc id="desc">Emblema originale con arena esagonale, cristallo centrale e accenti competitivi TFT.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#17345f"/>
      <stop offset="0.55" stop-color="#071a35"/>
      <stop offset="1" stop-color="#030815"/>
    </radialGradient>
    <linearGradient id="gold" x1="20%" y1="8%" x2="80%" y2="96%">
      <stop offset="0" stop-color="#fff1ad"/>
      <stop offset="0.42" stop-color="#d7a53d"/>
      <stop offset="1" stop-color="#805018"/>
    </linearGradient>
    <linearGradient id="crystal" x1="24%" y1="10%" x2="86%" y2="92%">
      <stop offset="0" stop-color="#81fff4"/>
      <stop offset="0.45" stop-color="#2cc7ff"/>
      <stop offset="1" stop-color="#7557ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M256 18 454 132v248L256 494 58 380V132Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="18"/>
  <path d="M256 62 414 153v206L256 450 98 359V153Z" fill="none" stroke="#36d8ff" stroke-opacity=".42" stroke-width="6"/>
  <path d="M256 108 354 165v113l-98 57-98-57V165Z" fill="#061225" stroke="#d7a53d" stroke-width="5"/>
  <path d="M256 126 321 164v75l-65 38-65-38v-75Z" fill="url(#crystal)" filter="url(#glow)"/>
  <path d="M256 126v151M191 164l130 75M321 164l-130 75" stroke="#e9fdff" stroke-opacity=".48" stroke-width="3"/>
  <path d="M144 340h224l-31 54H175Z" fill="url(#gold)"/>
  <text x="256" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#061225" letter-spacing="4">TFT</text>
</svg>
