<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round e Lobby - Lega TFT</title>
    <link rel="stylesheet" href="assets/css/tft-styles.css">
    <link rel="stylesheet" href="assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script>AdminAuth.requireAuth();</script>
    <style>
        body { background: #1a0f2e; color: #e2e8f0; }
        .table-admin { width: min(1180px, calc(100% - 32px)); margin: 24px auto; display: grid; gap: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .admin-panel { background: #2d1b4d; border: 1px solid rgba(243, 206, 52, 0.3); border-radius: 8px; padding: 20px; }
        .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(180px, auto) auto; gap: 10px; align-items: center; }
        .lobby-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .lobby-card { background: rgba(0, 0, 0, 0.26); border: 1px solid rgba(243, 206, 52, 0.24); border-radius: 8px; padding: 14px; display: grid; gap: 12px; }
        .lobby-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .lobby-title { font-weight: 800; color: #f3ce34; }
        .player-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .player-row:last-child { border-bottom: 0; }
        .player-meta { color: #d8c8ef; font-size: 0.85rem; overflow-wrap: anywhere; }
        .empty-state { color: #d8c8ef; padding: 12px 0; }
        input, select { background: #1a0a2e; border: 1px solid #f3ce34; color: #fff; padding: 12px; border-radius: 4px; min-width: 0; }
        button, .btn-link { background: #f3ce34; color: #000; border: none; padding: 10px 14px; border-radius: 4px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .secondary { background: #5c4a7d; color: #fff; }
        .danger { background: #dc3545; color: #fff; }
        .small-button { padding: 7px 9px; }
        @media (max-width: 760px) {
            .toolbar { grid-template-columns: 1fr; }
            button, .btn-link { justify-content: center; }
        }
    </style>
</head>

<body>
    <main class="table-admin">
        <div class="admin-header">
            <h1><i class="fas fa-table-cells-large"></i> Round e Lobby TFT</h1>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <a class="btn-link secondary" href="backend-improved.html"><i class="fas fa-arrow-left"></i> Gestione Tornei</a>
                <a class="btn-link secondary" href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            </div>
        </div>

        <section class="admin-panel">
            <div class="toolbar">
                <select id="tournamentSelect" aria-label="Seleziona torneo">
                    <option value="">Caricamento tornei...</option>
                </select>
                <input type="text" id="roundName" placeholder="Nome round (es. Round 1)">
                <button id="createRoundButton" type="button"><i class="fas fa-plus"></i> Crea round</button>
            </div>
        </section>

        <section class="admin-panel" id="roundPanel" style="display:none;">
            <div class="toolbar">
                <select id="roundSelect" aria-label="Seleziona round"></select>
                <input type="text" id="lobbyName" placeholder="Nome lobby (es. Lobby A)">
                <button id="createLobbyButton" type="button"><i class="fas fa-plus"></i> Crea lobby</button>
            </div>
        </section>

        <section class="admin-panel">
            <div id="statusMessage" class="empty-state">Seleziona un torneo per gestire round e lobby.</div>
            <div id="lobbyGrid" class="lobby-grid"></div>
        </section>
    </main>

    <script>
        const html = window.escapeHTML || (value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;'));
        let tornei = {};
        let currentTournamentId = '';
        let currentRoundId = '';
        let currentPlayers = {};
        let currentRounds = {};

        function playerName(player) {
            return player.nome || player.nickname || player.displayName || 'Giocatore';
        }

        function playerMeta(player) {
            return player.riotId ? `Riot ID: ${player.riotId}` : 'Riot ID non presente';
        }

        function selectedPlayerIds(round) {
            const ids = new Set();
            Object.values(round?.lobbies || {}).forEach(lobby => {
                Object.keys(lobby.playerIds || {}).forEach(id => ids.add(id));
            });
            return ids;
        }

        function setStatus(text) {
            document.getElementById('statusMessage').textContent = text;
        }

        function loadTournaments() {
            database.ref('tornei').once('value').then(snapshot => {
                tornei = snapshot.val() || {};
                const select = document.getElementById('tournamentSelect');
                const entries = Object.entries(tornei).sort((a, b) => (b[1].creatoIl || '').localeCompare(a[1].creatoIl || ''));
                select.innerHTML = '<option value="">Seleziona torneo</option>';
                entries.forEach(([id, torneo]) => {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = torneo.nome || 'Torneo senza nome';
                    select.appendChild(option);
                });
                if (entries.length === 0) setStatus('Nessun torneo disponibile.');
            }).catch(error => setStatus(`Errore caricamento tornei: ${error.message}`));
        }

        function loadTournament(id) {
            currentTournamentId = id;
            currentRoundId = '';
            currentPlayers = {};
            currentRounds = {};
            document.getElementById('lobbyGrid').innerHTML = '';
            document.getElementById('roundPanel').style.display = id ? 'block' : 'none';
            if (!id) {
                setStatus('Seleziona un torneo per gestire round e lobby.');
                return;
            }

            database.ref(`tornei/${id}`).on('value', snapshot => {
                const torneo = snapshot.val() || {};
                currentPlayers = torneo.giocatori || {};
                currentRounds = torneo.rounds || {};
                renderRoundSelect();
                renderLobbies();
            });
        }

        function renderRoundSelect() {
            const select = document.getElementById('roundSelect');
            const entries = Object.entries(currentRounds).sort((a, b) => (a[1].createdAt || '').localeCompare(b[1].createdAt || ''));
            select.innerHTML = '';
            if (entries.length === 0) {
                select.innerHTML = '<option value="">Nessun round creato</option>';
                currentRoundId = '';
                return;
            }
            entries.forEach(([id, round]) => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = round.name || 'Round';
                select.appendChild(option);
            });
            if (!currentRoundId || !currentRounds[currentRoundId]) {
                currentRoundId = entries[0][0];
            }
            select.value = currentRoundId;
        }

        function renderLobbies() {
            const grid = document.getElementById('lobbyGrid');
            grid.innerHTML = '';

            if (!currentTournamentId) return;
            if (Object.keys(currentPlayers).length === 0) {
                setStatus('Importa o aggiungi giocatori nel torneo prima di creare le lobby.');
                return;
            }
            if (!currentRoundId) {
                setStatus('Crea un round per iniziare ad assegnare le lobby.');
                return;
            }

            const round = currentRounds[currentRoundId] || {};
            const lobbies = Object.entries(round.lobbies || {}).sort((a, b) => (a[1].createdAt || '').localeCompare(b[1].createdAt || ''));
            setStatus(lobbies.length ? `Round attivo: ${round.name || 'Round'}` : 'Crea una lobby per questo round.');
            if (lobbies.length === 0) return;

            const alreadySelected = selectedPlayerIds(round);
            lobbies.forEach(([lobbyId, lobby]) => {
                const assignedIds = Object.keys(lobby.playerIds || {});
                const card = document.createElement('article');
                card.className = 'lobby-card';
                const options = Object.entries(currentPlayers)
                    .filter(([playerId]) => !alreadySelected.has(playerId))
                    .sort((a, b) => playerName(a[1]).localeCompare(playerName(b[1]), 'it'))
                    .map(([playerId, player]) => `<option value="${html(playerId)}">${html(playerName(player))}</option>`)
                    .join('');

                card.innerHTML = `
                    <div class="lobby-head">
                        <div class="lobby-title">${html(lobby.name || 'Lobby')}</div>
                        <button class="small-button danger" type="button" data-delete-lobby="${html(lobbyId)}"><i class="fas fa-trash"></i></button>
                    </div>
                    <div>
                        ${assignedIds.length ? assignedIds.map(playerId => {
                            const player = currentPlayers[playerId] || {};
                            return `
                                <div class="player-row">
                                    <div>
                                        <strong>${html(playerName(player))}</strong>
                                        <div class="player-meta">${html(playerMeta(player))}</div>
                                    </div>
                                    <button class="small-button danger" type="button" data-remove-player="${html(playerId)}" data-lobby="${html(lobbyId)}"><i class="fas fa-times"></i></button>
                                </div>`;
                        }).join('') : '<div class="empty-state">Nessun giocatore in questa lobby.</div>'}
                    </div>
                    <div class="toolbar" style="grid-template-columns:minmax(0,1fr) auto;">
                        <select data-player-select="${html(lobbyId)}" aria-label="Giocatore da aggiungere">
                            <option value="">Aggiungi giocatore</option>
                            ${options}
                        </select>
                        <button type="button" data-add-player="${html(lobbyId)}"><i class="fas fa-user-plus"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function createRound() {
            if (!currentTournamentId) return setStatus('Seleziona prima un torneo.');
            const input = document.getElementById('roundName');
            const name = input.value.trim() || `Round ${Object.keys(currentRounds).length + 1}`;
            database.ref(`tornei/${currentTournamentId}/rounds`).push({
                name,
                lobbies: {},
                createdAt: new Date().toISOString()
            }).then(ref => {
                currentRoundId = ref.key;
                input.value = '';
            }).catch(error => setStatus(`Errore creazione round: ${error.message}`));
        }

        function createLobby() {
            if (!currentTournamentId || !currentRoundId) return setStatus('Seleziona un round.');
            const input = document.getElementById('lobbyName');
            const round = currentRounds[currentRoundId] || {};
            const count = Object.keys(round.lobbies || {}).length + 1;
            const name = input.value.trim() || `Lobby ${count}`;
            database.ref(`tornei/${currentTournamentId}/rounds/${currentRoundId}/lobbies`).push({
                name,
                playerIds: {},
                createdAt: new Date().toISOString()
            }).then(() => {
                input.value = '';
            }).catch(error => setStatus(`Errore creazione lobby: ${error.message}`));
        }

        function addPlayer(lobbyId) {
            const select = document.querySelector(`[data-player-select="${lobbyId}"]`);
            const playerId = select?.value;
            if (!playerId) return;
            database.ref(`tornei/${currentTournamentId}/rounds/${currentRoundId}/lobbies/${lobbyId}/playerIds/${playerId}`).set(true)
                .catch(error => setStatus(`Errore assegnazione giocatore: ${error.message}`));
        }

        function removePlayer(lobbyId, playerId) {
            database.ref(`tornei/${currentTournamentId}/rounds/${currentRoundId}/lobbies/${lobbyId}/playerIds/${playerId}`).remove()
                .catch(error => setStatus(`Errore rimozione giocatore: ${error.message}`));
        }

        function deleteLobby(lobbyId) {
            if (!confirm('Eliminare questa lobby?')) return;
            database.ref(`tornei/${currentTournamentId}/rounds/${currentRoundId}/lobbies/${lobbyId}`).remove()
                .catch(error => setStatus(`Errore eliminazione lobby: ${error.message}`));
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTournaments();
            document.getElementById('tournamentSelect').addEventListener('change', event => loadTournament(event.target.value));
            document.getElementById('roundSelect').addEventListener('change', event => {
                currentRoundId = event.target.value;
                renderLobbies();
            });
            document.getElementById('createRoundButton').addEventListener('click', createRound);
            document.getElementById('createLobbyButton').addEventListener('click', createLobby);
            document.getElementById('lobbyGrid').addEventListener('click', event => {
                const addButton = event.target.closest('[data-add-player]');
                const removeButton = event.target.closest('[data-remove-player]');
                const deleteButton = event.target.closest('[data-delete-lobby]');
                if (addButton) addPlayer(addButton.dataset.addPlayer);
                if (removeButton) removePlayer(removeButton.dataset.lobby, removeButton.dataset.removePlayer);
                if (deleteButton) deleteLobby(deleteButton.dataset.deleteLobby);
            });
        });
    </script>
</body>

</html>
